# HR Policy SLM Assistant
# LoRA Training Configuration

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  max_length: 512
  torch_dtype: "float16"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"

training:
  epochs: 3
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 4
  warmup_steps: 5
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  seed: 42

dataset:
  train_file: "data/splits/train.json"
  validation_file: "data/splits/validation.json"
  test_file: "data/splits/test.json"

output:
  adapter_dir: "experiments/lora_adapter"
  logs_dir: "experiments/lora_logs"